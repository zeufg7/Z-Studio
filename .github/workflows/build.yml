name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact: ZeufgStudio-Windows-x64
          - name: macOS (Intel + Apple Silicon)
            os: macos-14
            artifact: ZeufgStudio-macOS-universal

    steps:
      - name: Baixar código (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preparar MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configurar (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Compilar
        run: cmake --build build --config Release

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/ZeufgStudio_artefacts/Release/Zeufg Studio.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Empacotar (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="build/ZeufgStudio_artefacts/Release/Zeufg Studio.app"
          lipo -info "$APP/Contents/MacOS/Zeufg Studio"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          cp -R "$APP" dist/
          cp README.md LICENSE dist/
          ditto -c -k --sequesterRsrc --keepParent dist "${{ matrix.artifact }}.zip"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
